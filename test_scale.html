<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale Test</title>
<style>
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
  .stage-wrapper {
    width: 1920px;
    height: 1080px;
    background: #333;
    color: white;
    transform-origin: center center;
    position: relative;
  }
</style>
</head>
<body>
  <div class="stage-wrapper" id="stage">
    <h1>Projector Content</h1>
  </div>
  <script>
    function updateScale() {
      const stage = document.getElementById('stage');
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const scaleW = winW / 1920;
      const scaleH = winH / 1080;
      const scale = Math.min(scaleW, scaleH);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', updateScale);
    updateScale();
  </script>
</body>
</html>
