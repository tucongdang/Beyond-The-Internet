<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190839" />
      <stop offset="50%" stop-color="#0D0420" />
      <stop offset="100%" stop-color="#050110" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="40%" stop-color="#F7CAC9" />
      <stop offset="100%" stop-color="#F6B17A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle border outline -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#F7CAC9" stroke-opacity="0.25" stroke-width="3" />

  <!-- Outer Orbital Ambient Glow -->
  <ellipse cx="256" cy="256" rx="190" ry="80" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-dasharray="16 12" transform="rotate(-25 256 256)" filter="url(#glow)" opacity="0.6" />
  
  <!-- Main Orbital Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" transform="rotate(-25 256 256)" />

  <!-- Central Futuristic Diamond / Hex Emblem -->
  <g filter="url(#softShadow)">
    <!-- Backing Glow Diamond -->
    <polygon points="256,90 390,256 256,422 122,256" fill="#241148" stroke="url(#primaryGrad)" stroke-width="5" />
    
    <!-- Inner Core Diamond -->
    <polygon points="256,130 355,256 256,382 157,256" fill="url(#bgGrad)" stroke="#7C3AED" stroke-width="3" opacity="0.9" />

    <!-- Center Lightning / Academic Star Spark -->
    <path d="M256,155 L268,235 L335,256 L268,277 L256,357 L244,277 L177,256 L244,235 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
    
    <!-- Center Core Glow Point -->
    <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
  </g>

  <!-- Typography BTI 2026 -->
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="6" fill="#FFFFFF">
    BTI <tspan fill="#F7CAC9">2026</tspan>
  </text>

  <!-- Small Satellite Sparkles -->
  <circle cx="100" cy="140" r="5" fill="#F7CAC9" opacity="0.8" />
  <circle cx="410" cy="120" r="7" fill="#F6B17A" opacity="0.9" />
  <circle cx="390" cy="380" r="4" fill="#FFFFFF" opacity="0.7" />
  <circle cx="120" cy="370" r="6" fill="#7C3AED" opacity="0.8" />
</svg>
