<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beyond The Internet 2026</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        // If loaded at /Beyond-The-Internet without trailing slash or on deep link, redirect to base
        if (!path.endsWith('/')) {
          window.location.replace(path + '/' + search + hash);
        } else {
          window.location.replace('./' + search + hash);
        }
      })();
    </script>
  </head>
  <body style="background: #0D0420; color: #F7CAC9; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="margin-bottom: 8px;">Đang tải Beyond The Internet 2026...</h2>
      <p style="opacity: 0.7; font-size: 14px;">Tự động chuyển hướng về trang chủ trận đấu</p>
    </div>
  </body>
</html>
