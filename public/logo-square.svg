<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="100%" height="100%">
  <defs>
    <style>
      @font-face {
        font-family: 'SVN-Gilroy';
        src: url('/fonts/SVN-Gilroy-Black.otf') format('opentype');
        font-weight: 900;
        font-style: normal;
      }
      .bti-square-text {
        font-family: 'SVN-Gilroy', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        fill: url(#btiSquareGradient);
        text-anchor: middle;
      }
    </style>
    <!-- Smooth Horizontal Gradient across width -->
    <linearGradient id="btiSquareGradient" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="500" y2="0">
      <stop offset="0%" stop-color="#F7CAC9" />
      <stop offset="28%" stop-color="#EFBFCE" />
      <stop offset="60%" stop-color="#DEC1E6" />
      <stop offset="85%" stop-color="#CFCAEC" />
      <stop offset="100%" stop-color="#C7CEEA" />
    </linearGradient>
  </defs>

  <rect width="540" height="540" rx="64" fill="#0D0420" />

  <g class="bti-square-text">
    <text x="270" y="180" font-size="48" letter-spacing="1.2">BEYOND THE</text>
    <text x="270" y="246" font-size="56" letter-spacing="1.8">INTERNET</text>
    <text x="270" y="418" font-size="200" letter-spacing="-3.5">2027</text>
  </g>
</svg>
